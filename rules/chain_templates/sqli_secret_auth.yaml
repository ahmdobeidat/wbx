id: sqli_to_secret_to_auth
name: SQLi -> leak secret -> forge auth
impact: Auth bypass / privilege escalation using a secret pulled via SQLi
bonus: 9
requires:
  - any_of: [sql_injection, php_sqli, nosql_injection]
  - any_of: [jwt_none_alg, auth_bypass, hardcoded_secret, php_type_juggling]
playbook: |
  Classic two-stage CTF web chain:
  1. Use the injection to dump the users table / a secret column (admin_key, jwt secret).
     Remember mixed-case uNiOn SELECt if a keyword filter exists (LLMPics lesson).
  2. Use the leaked secret to forge a session/JWT or satisfy the weak comparison,
     logging in as admin -> flag.
